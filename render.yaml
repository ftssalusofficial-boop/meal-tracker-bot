services:
  - type: web
    name: meal-tracker-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --worker-class gthread --threads 4 --timeout 90
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
